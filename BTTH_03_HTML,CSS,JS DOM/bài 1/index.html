<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sinh Viên</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
       
        <h2 class="page-title">Quản Lý Sinh Viên</h2>
     
        <!-- BỔ SUNG: Thanh công cụ chứa nút Thêm mới (btn-open-modal) -->
        <div class="toolbar">
            <button id="btn-open-modal" class="btn btn-primary">+ Thêm sinh viên mới</button>
           
        </div>

        <!-- Bảng hiển thị dữ liệu -->
        <table class="table">
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Mã SV</th>
                    <th>Họ và Tên</th>
                    <th>Ngày sinh</th>
                    <th>Lớp</th>
                    <th>Điểm TB</th>
                    <th>Email</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="student-tbody">
                <!-- Dữ liệu render từ JS sẽ nằm ở đây -->
            </tbody>
        </table>
        <div class="table-footer">
            <div class="statistics">
                <span>Tổng số sinh viên: <strong id="total-students">0</strong></span>
                <span>Điểm TB Lớp: <strong id="average-score">0.0</strong></span>
                
            </div>
        </div>
    </div>

    <!-- Modal Form (Popup) -->
    <div id="student-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="modal-title">Thêm sinh viên mới</h3>
            
            <form id="student-form">
                <input type="hidden" id="edit-index" value="-1">
                
                <div class="form-group">
                    <label>Mã sinh viên:</label>
                    <input type="text" id="student-id" required>
                </div>
                <div class="form-group">
                    <label>Họ và tên:</label>
                    <input type="text" id="fullname" required>
                </div>
                <div class="form-group">
                    <label>Ngày sinh:</label>
                    <input type="date" id="dob" required>
                </div>
                <div class="form-group">
                    <label>Lớp học:</label>
                    <input type="text" id="class-name" required>
                </div>
                <div class="form-group">
                    <label>Điểm trung bình (0-10):</label>
                    <!-- Sửa sang type="number" hỗ trợ nhập số thực -->
                    <input type="number" id="gpa" step="0.1" min="0" max="10" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="email" required>
                </div>
                
                <div class="modal-actions">
                    <button type="button" id="btn-close-modal" class="btn btn-secondary">Hủy</button>
                    <button type="submit" class="btn btn-success">Lưu dữ liệu</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
