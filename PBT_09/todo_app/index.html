<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Tiêu đề & Nút Thêm dạng tròn ở góc phải -->
        <div class="app-header">
            <h2><i class="fa-solid fa-list-check"></i> Quản Lý Công Việc</h2>
            <button id="btn-open-modal" class="btn-add-round"><i class="fa-solid fa-plus"></i></button>
        </div>

        <!-- Các thanh trạng thái / Bộ lọc (Chỉ hiển thị tĩnh theo giao diện mẫu) -->
        <div class="filter-bar">
            <div class="filter-group">
                <button class="filter-btn active">Tất cả (<span id="total-tasks">0</span>)</button>
                <button class="filter-btn text-success">Hoàn thành (<span id="completed-tasks">0</span>)</button>
                <button class="filter-btn text-primary">Chưa hoàn thành (<span id="pending-tasks">0</span>)</button>
            </div>
            <div class="filter-group">
                <button class="filter-btn badge-all-priority">Tất cả ưu tiên</button>
                <button class="filter-btn badge-low-outline">Ưu tiên thấp</button>
                <button class="filter-btn badge-medium-outline">Ưu tiên trung bình</button>
                <button class="filter-btn badge-high-outline">Ưu tiên cao</button>
            </div>
        </div>

        <div id="task-container" class="task-grid">
            <!-- Các thẻ Task Card từ JS sẽ được render ở đây -->
        </div>
    </div>
    <div id="task-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-list-check"></i> <span id="modal-title">Thêm công việc mới</span></h3>
                <button id="btn-close-modal-x" class="close-x-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="task-form">
                <input type="hidden" id="edit-index" value="-1">
                
                <div class="form-group">
                    <label><i class="fa-solid fa-heading"></i> Tiêu đề *</label>
                    <input type="text" id="task-title" placeholder="Nhập tiêu đề công việc" required>
                </div>
                
                <div class="form-group">
                    <label><i class="fa-solid fa-bars"></i> Mô tả</label>
                    <textarea id="task-desc" maxlength="200" placeholder="Mô tả chi tiết công việc (tối đa 200 ký tự)" required></textarea>
                    <div class="char-count"><span id="char-current">0</span>/200 ký tự</div>
                </div>
                
                <div class="form-row">
                    <div class="form-group col-6">
                        <label><i class="fa-solid fa-triangle-exclamation"></i> Độ ưu tiên *</label>
                        <select id="task-priority" required>
                            <option value="Thấp">Thấp</option>
                            <option value="Trung bình" selected>Trung bình</option>
                            <option value="Cao">Cao</option>
                        </select>
                    </div>
                    <div class="form-group col-6">
                        <label><i class="fa-solid fa-calendar-days"></i> Hạn hoàn thành *</label>
                        <input type="date" id="task-deadline" required>
                    </div>
                </div>
                
                <div class="modal-actions">
                    <button type="button" id="btn-close-modal" class="btn btn-cancel"><i class="fa-solid fa-xmark"></i> Hủy</button>
                    <button type="submit" class="btn btn-submit" id="btn-submit-text"><i class="fa-solid fa-floppy-disk"></i> Thêm</button>
                </div>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
