<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>B2 - CSS Animations</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>
    <div class="animation-container">
        <h2>Demo 5 Hiệu ứng CSS</h2>
        
        <!-- Hiệu ứng 4: Spinner -->
        <div class="spinner"></div>

        <!-- Hiệu ứng 5: Fade-in khi scroll (giả lập) -->
        <div class="product-card fade-in-scroll">
            
            <!-- Hiệu ứng 3: Image Zoom -->
            <div class="img-container">
                <img src="image/ảnh khánh.png" alt="Ngọc Khánh">
            </div>
            
            <h3>Ngọc Khánh</h3>
            
            <!-- Hiệu ứng 2: Button Hover -->
            <button class="buy-btn">Đăng kí</button>
        </div>
    </div>
</body>
</html>
